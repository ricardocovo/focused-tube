name: Assign to Copilot on spec-approved

on:
  issues:
    types: [labeled]

permissions:
  issues: write

jobs:
  assign:
    if: github.event.label.name == 'spec-approved'
    runs-on: ubuntu-latest
    steps:
      - name: Debug event context
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          script: |
            core.info(`Event action: ${context.payload.action}`);
            core.info(`Label added: ${context.payload.label?.name}`);
            core.info(`Issue number: ${context.issue.number}`);
            core.info(`Repo: ${context.repo.owner}/${context.repo.repo}`);
            core.info(`Current assignees: ${JSON.stringify(context.payload.issue?.assignees?.map(a => a.login))}`);

      - name: Check if copilot is a valid assignee
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          script: |
            try {
              const result = await github.rest.issues.checkUserCanBeAssigned({
                owner: context.repo.owner,
                repo: context.repo.repo,
                assignee: 'copilot',
              });
              core.info(`copilot can be assigned — HTTP status: ${result.status}`);
            } catch (err) {
              core.warning(`copilot assignee check failed: ${err.status} ${err.message}`);
            }

      - name: Assign issue to Copilot
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          script: |
            try {
              const response = await github.rest.issues.addAssignees({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                assignees: ['@copilot'],
              });
              core.info(`addAssignees HTTP status: ${response.status}`);
              const assignees = response.data.assignees ?? [];
              core.info(`Issue assignees after update: ${JSON.stringify(assignees.map(a => a.login))}`);
              if (assignees.length === 0) {
                core.setFailed('Assignment failed: issue has no assignees after update. The "copilot" login may not be a valid assignee for this repo.');
              }
            } catch (err) {
              core.setFailed(`addAssignees failed: ${err.status} — ${err.message}`);
            }
