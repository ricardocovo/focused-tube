name: CI/CD

on:
  workflow_dispatch:
    inputs:
      deploy_api:
        description: Deploy API (Container App)
        type: boolean
        default: true
      deploy_client:
        description: Deploy Client (Static Web App)
        type: boolean
        default: true

permissions:
  contents: read

env:
  NODE_VERSION: "24"

jobs:
  # ── Lint & Test ──────────────────────────────────────
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build all workspaces
        run: npm run build

      - name: Run tests
        run: npm run test

  # ── Deploy API (Container App) ──────────────────────
  deploy-api:
    name: Deploy API
    needs: [test]
    if: ${{ inputs.deploy_api }}
    runs-on: ubuntu-latest
    environment: DEV
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Azure Login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        uses: docker/login-action@v4.1.0
        with:
          registry: ${{ vars.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7.1.0
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: |
            ${{ vars.ACR_LOGIN_SERVER }}/focused-tube-api:${{ github.sha }}
            ${{ vars.ACR_LOGIN_SERVER }}/focused-tube-api:latest

      - name: Deploy to Container App
        uses: azure/cli@v2
        with:
          inlineScript: |
            az containerapp update \
              --name ${{ vars.CONTAINER_APP_NAME }} \
              --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
              --image ${{ vars.ACR_LOGIN_SERVER }}/focused-tube-api:${{ github.sha }}

  # ── Deploy Client (Static Web App) ──────────────────
  deploy-client:
    name: Deploy Client
    needs: [test]
    if: ${{ inputs.deploy_client }}
    runs-on: ubuntu-latest
    environment: DEV
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build client
        run: npm run build --workspace=client
        env:
          VITE_API_URL: ${{ vars.CONTAINER_APP_FQDN }}

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.SWA_DEPLOYMENT_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: client
          output_location: dist
          skip_app_build: true
